components:
  schemas:
    WrapperLong:
      type: integer
    PageSize:
      type: integer
      minimum: 1
      maximum: 100
    DescribeTestCasesOutput:
      type: object
      properties:
        nextToken:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ' During a previous call, the maximum number of items that can be returned is the value specified in <code>maxResults</code>. If there more items in the list, then a unique string called a <i>nextToken</i> is returned. To get the next batch of items in the list, call this operation again, adding the next token to the call. To get all of the items in the list, keep calling this operation with each subsequent next token that is returned, until no more next tokens are returned. '
        testCases:
          allOf:
          - $ref: '#/components/schemas/TestCases'
          - description: ' The returned list of test cases. '
    NonEmptyString:
      type: string
      minLength: 1
    Timestamp:
      type: string
      format: date-time
    TestCases:
      type: array
      items:
        $ref: '#/components/schemas/TestCase'
    DescribeTestCasesInput:
      type: object
      required:
      - reportArn
      title: DescribeTestCasesInput
      properties:
        reportArn:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ' The ARN of the report for which test cases are returned. '
        nextToken:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ' During a previous call, the maximum number of items that can be returned is the value specified in <code>maxResults</code>. If there more items in the list, then a unique string called a <i>nextToken</i> is returned. To get the next batch of items in the list, call this operation again, adding the next token to the call. To get all of the items in the list, keep calling this operation with each subsequent next token that is returned, until no more next tokens are returned. '
        maxResults:
          allOf:
          - $ref: '#/components/schemas/PageSize'
          - description: ' The maximum number of paginated test cases returned per response. Use <code>nextToken</code> to iterate pages in the list of returned <code>TestCase</code> objects. The default value is 100. '
        filter:
          allOf:
          - $ref: '#/components/schemas/TestCaseFilter'
          - description: ' A <code>TestCaseFilter</code> object used to filter the returned reports. '
    TestCase:
      type: object
      properties:
        reportArn:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: ' The ARN of the report to which the test case belongs. '
        testRawDataPath:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ' The path to the raw data file that contains the test result. '
        prefix:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ' A string that is applied to a series of related test cases. CodeBuild generates the prefix. The prefix depends on the framework used to generate the tests. '
        name:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ' The name of the test case. '
        status:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ' The status returned by the test case after it was run. Valid statuses are <code>SUCCEEDED</code>, <code>FAILED</code>, <code>ERROR</code>, <code>SKIPPED</code>, and <code>UNKNOWN</code>. '
        durationInNanoSeconds:
          allOf:
          - $ref: '#/components/schemas/WrapperLong'
          - description: ' The number of nanoseconds it took to run this test case. '
        message:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ' A message associated with a test case. For example, an error message or stack trace. '
        expired:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: ' The date and time a test case expires. A test case expires 30 days after it is created. An expired test case is not available to view in CodeBuild. '
      description: ' Information about a test case created using a framework such as NUnit or Cucumber. A test case might be a unit test or a configuration test. '
    String:
      type: string
    InvalidInputException: {}
    ResourceNotFoundException: {}
    TestCaseFilter:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: <p>The status used to filter test cases. A <code>TestCaseFilter</code> can have one status. Valid values are:</p> <ul> <li> <p> <code>SUCCEEDED</code> </p> </li> <li> <p> <code>FAILED</code> </p> </li> <li> <p> <code>ERROR</code> </p> </li> <li> <p> <code>SKIPPED</code> </p> </li> <li> <p> <code>UNKNOWN</code> </p> </li> </ul>
        keyword:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: A keyword that is used to filter on the <code>name</code> or the <code>prefix</code> of the test cases. Only test cases where the keyword is a substring of the <code>name</code> or the <code>prefix</code> will be returned.
      description: A filter used to return specific types of test cases. In order to pass the filter, the report must meet all of the filter properties.
