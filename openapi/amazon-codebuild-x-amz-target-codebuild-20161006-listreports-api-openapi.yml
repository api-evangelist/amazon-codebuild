        maxResults:
          allOf:
          - $ref: '#/components/schemas/PageSize'
          - description: ' The maximum number of paginated reports returned per response. Use <code>nextToken</code> to iterate pages in the list of returned <code>Report</code> objects. The default value is 100. '
        filter:
          allOf:
          - $ref: '#/components/schemas/ReportFilter'
          - description: ' A <code>ReportFilter</code> object used to filter the returned reports. '
    ReportFilter:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/ReportStatusType'
          - description: ' The status used to filter reports. You can filter using one status only. '
      description: ' A filter used to return reports with the status specified by the input <code>status</code> parameter. '
