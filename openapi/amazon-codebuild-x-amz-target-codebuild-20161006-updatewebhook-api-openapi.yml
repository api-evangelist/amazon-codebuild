      description: <p> Updates the webhook associated with an CodeBuild build project. </p> <note> <p> If you use Bitbucket for your repository, <code>rotateSecret</code> is ignored. </p> </note>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWebhookOutput'
              examples:
                UpdateWebhook200Example:
                  summary: Default UpdateWebhook 200 response
                  x-microcks-default: true
                  value:
                    webhook: example-value
        '480':
          description: InvalidInputException
          content:
            application/json:
              schema:
