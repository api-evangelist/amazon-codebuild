              examples:
                UpdateWebhook480Example:
                  summary: Default UpdateWebhook 480 response
                  x-microcks-default: true
                  value: example-value
        '481':
          description: ResourceNotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceNotFoundException'
              examples:
                UpdateWebhook481Example:
                  summary: Default UpdateWebhook 481 response
                  x-microcks-default: true
                  value: example-value
        '482':
          description: OAuthProviderException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthProviderException'
              examples:
                UpdateWebhook482Example:
                  summary: Default UpdateWebhook 482 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookInput'
            examples:
              UpdateWebhookRequestExample:
                summary: Default UpdateWebhook request
                x-microcks-default: true
                value:
                  projectName: example-resource
                  branchFilter: example-value
                  rotateSecret: example-value
                  filterGroups: example-value
                  buildType: STANDARD
      parameters:
      - name: X-Amz-Target
