    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: DescribeCodeCoverages
      description: Retrieves one or more code coverage reports.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeCodeCoveragesOutput'
              examples:
                DescribeCodeCoverages200Example:
                  summary: Default DescribeCodeCoverages 200 response
                  x-microcks-default: true
                  value:
                    nextToken: example-value
                    codeCoverages: example-value
        '480':
          description: InvalidInputException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidInputException'
              examples:
                DescribeCodeCoverages480Example:
                  summary: Default DescribeCodeCoverages 480 response
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescribeCodeCoveragesInput'
            examples:
              DescribeCodeCoveragesRequestExample:
                summary: Default DescribeCodeCoverages request
                x-microcks-default: true
                value:
                  reportArn: arn:aws:service:us-east-1:123456789012:resource/example
                  nextToken: example-value
                  maxResults: example-value
                  sortOrder: example-value
                  sortBy: example-value
                  minLineCoveragePercentage: example-value
                  maxLineCoveragePercentage: example-value
      parameters:
      - name: maxResults
        in: query
        schema:
          type: string
        description: Pagination limit
        required: false
      - name: nextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - CodeBuild_20161006.DescribeCodeCoverages
      summary: Amazon CodeBuild Describe Code Coverages
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=CodeBuild 20161006.DescribeCodeCoverages'
components:
  schemas:
    ReportCodeCoverageSortByType:
      type: string
      enum:
      - LINE_COVERAGE_PERCENTAGE
      - FILE_PATH
    String:
      type: string
    NonNegativeInt:
      type: integer
      minimum: 0
    NonEmptyString:
      type: string
      minLength: 1
    DescribeCodeCoveragesOutput:
      type: object
      properties:
        nextToken:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: If there are more items to return, this contains a token that is passed to a subsequent call to <code>DescribeCodeCoverages</code> to retrieve the next set of items.
        codeCoverages:
          allOf:
          - $ref: '#/components/schemas/CodeCoverages'
          - description: An array of <code>CodeCoverage</code> objects that contain the results.
    CodeCoverage:
      type: object
      properties:
        id:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: The identifier of the code coverage report.
        reportARN:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: The ARN of the report.
        filePath:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: The path of the test report file.
        lineCoveragePercentage:
          allOf:
          - $ref: '#/components/schemas/Percentage'
          - description: The percentage of lines that are covered by your tests.
        linesCovered:
          allOf:
          - $ref: '#/components/schemas/NonNegativeInt'
          - description: The number of lines that are covered by your tests.
        linesMissed:
          allOf:
          - $ref: '#/components/schemas/NonNegativeInt'
          - description: The number of lines that are not covered by your tests.
        branchCoveragePercentage:
          allOf:
          - $ref: '#/components/schemas/Percentage'
          - description: The percentage of branches that are covered by your tests.
        branchesCovered:
          allOf:
          - $ref: '#/components/schemas/NonNegativeInt'
          - description: The number of conditional branches that are covered by your tests.
        branchesMissed:
          allOf:
          - $ref: '#/components/schemas/NonNegativeInt'
          - description: The number of conditional branches that are not covered by your tests.
        expired:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: The date and time that the tests were run.
      description: <p>Contains code coverage report information.</p> <p>Line coverage measures how many statements your tests cover. A statement is a single instruction, not including comments, conditionals, etc.</p> <p>Branch coverage determines if your tests cover every possible branch of a control structure, such as an <code>if</code> or <code>case</code> statement.</p>
    SortOrderType:
      type: string
      enum:
      - ASCENDING
      - DESCENDING
    Timestamp:
      type: string
      format: date-time
    DescribeCodeCoveragesInput:
      type: object
      required:
      - reportArn
      title: DescribeCodeCoveragesInput
      properties:
        reportArn:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: ' The ARN of the report for which test cases are returned. '
        nextToken:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The <code>nextToken</code> value returned from a previous call to <code>DescribeCodeCoverages</code>. This specifies the next item to return. To return the beginning of the list, exclude this parameter.
        maxResults:
          allOf:
          - $ref: '#/components/schemas/PageSize'
          - description: The maximum number of results to return.
        sortOrder:
          allOf:
          - $ref: '#/components/schemas/SortOrderType'
          - description: Specifies if the results are sorted in ascending or descending order.
        sortBy:
          allOf:
          - $ref: '#/components/schemas/ReportCodeCoverageSortByType'
          - description: <p>Specifies how the results are sorted. Possible values are:</p> <dl> <dt>FILE_PATH</dt> <dd> <p>The results are sorted by file path.</p> </dd> <dt>LINE_COVERAGE_PERCENTAGE</dt> <dd> <p>The results are sorted by the percentage of lines that are covered.</p> </dd> </dl>
        minLineCoveragePercentage:
          allOf:
          - $ref: '#/components/schemas/Percentage'
          - description: The minimum line coverage percentage to report.
        maxLineCoveragePercentage:
          allOf:
          - $ref: '#/components/schemas/Percentage'
          - description: The maximum line coverage percentage to report.
    CodeCoverages:
      type: array
      items:
        $ref: '#/components/schemas/CodeCoverage'
    PageSize:
      type: integer
      minimum: 1
      maximum: 100
    InvalidInputException: {}
    Percentage:
      type: number
      format: double
      minimum: 0
      maximum: 100
  parameters:
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
