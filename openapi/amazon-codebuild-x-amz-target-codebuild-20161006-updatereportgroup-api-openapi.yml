components:
  schemas:
    ReportPackagingType:
      type: string
      enum:
      - ZIP
      - NONE
    Tag:
      type: object
      properties:
        key:
          allOf:
          - $ref: '#/components/schemas/KeyInput'
          - description: The tag's key.
        value:
          allOf:
          - $ref: '#/components/schemas/ValueInput'
          - description: The tag's value.
      description: <p>A tag, consisting of a key and a value.</p> <p>This tag is available for use by Amazon Web Services services that support tags in CodeBuild.</p>
    ResourceNotFoundException: {}
    NonEmptyString:
      type: string
      minLength: 1
    WrapperBoolean:
      type: boolean
    Timestamp:
      type: string
      format: date-time
    UpdateReportGroupInput:
      type: object
      required:
      - arn
      title: UpdateReportGroupInput
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: ' The ARN of the report group to update. '
        exportConfig:
          allOf:
          - $ref: '#/components/schemas/ReportExportConfig'
          - description: '<p> Used to specify an updated export type. Valid values are: </p> <ul> <li> <p> <code>S3</code>: The report results are exported to an S3 bucket. </p> </li> <li> <p> <code>NO_EXPORT</code>: The report results are not exported. </p> </li> </ul>'
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: <p> An updated list of tag key and value pairs associated with this report group. </p> <p>These tags are available for use by Amazon Web Services services that support CodeBuild report group tags.</p>
    TagList:
      type: array
      items:
        $ref: '#/components/schemas/Tag'
      minItems: 0
      maxItems: 50
    ReportType:
      type: string
      enum:
      - TEST
      - CODE_COVERAGE
    ReportExportConfigType:
      type: string
      enum:
      - S3
      - NO_EXPORT
    S3ReportExportConfig:
      type: object
      properties:
        bucket:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: ' The name of the S3 bucket where the raw data of a report are exported. '
        bucketOwner:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The Amazon Web Services account identifier of the owner of the Amazon S3 bucket. This allows report data to be exported to an Amazon S3 bucket that is owned by an account other than the account running the build.
        path:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: ' The path to the exported report''s raw data results. '
        packaging:
          allOf:
          - $ref: '#/components/schemas/ReportPackagingType'
          - description: '<p> The type of build output artifact to create. Valid values include: </p> <ul> <li> <p> <code>NONE</code>: CodeBuild creates the raw data in the output bucket. This is the default if packaging is not specified. </p> </li> <li> <p> <code>ZIP</code>: CodeBuild creates a ZIP file with the raw data in the output bucket. </p> </li> </ul>'
        encryptionKey:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: ' The encryption key for the report''s encrypted raw data. '
        encryptionDisabled:
          allOf:
          - $ref: '#/components/schemas/WrapperBoolean'
          - description: ' A boolean value that specifies if the results of a report are encrypted. '
      description: ' Information about the S3 bucket where the raw data of a report are exported. '
    ReportGroupStatusType:
      type: string
      enum:
      - ACTIVE
      - DELETING
    ReportGroupName:
      type: string
      minLength: 2
      maxLength: 128
    ReportExportConfig:
      type: object
      properties:
        exportConfigType:
          allOf:
          - $ref: '#/components/schemas/ReportExportConfigType'
          - description: '<p> The export configuration type. Valid values are: </p> <ul> <li> <p> <code>S3</code>: The report results are exported to an S3 bucket. </p> </li> <li> <p> <code>NO_EXPORT</code>: The report results are not exported. </p> </li> </ul>'
        s3Destination:
          allOf:
          - $ref: '#/components/schemas/S3ReportExportConfig'
          - description: ' A <code>S3ReportExportConfig</code> object that contains information about the S3 bucket where the run of a report is exported. '
      description: ' Information about the location where the run of a report is exported. '
    String:
      type: string
    KeyInput:
      type: string
      pattern: ^([\p{L}\p{Z}\p{N}_.:/=@+\-]*)$
      minLength: 1
      maxLength: 127
    UpdateReportGroupOutput:
      type: object
      properties:
        reportGroup:
          allOf:
          - $ref: '#/components/schemas/ReportGroup'
          - description: ' Information about the updated report group. '
    ReportGroup:
      type: object
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/NonEmptyString'
          - description: 'The ARN of the <code>ReportGroup</code>. '
        name:
          allOf:
          - $ref: '#/components/schemas/ReportGroupName'
          - description: 'The name of the <code>ReportGroup</code>. '
        type:
          allOf:
          - $ref: '#/components/schemas/ReportType'
          - description: <p>The type of the <code>ReportGroup</code>. This can be one of the following values:</p> <dl> <dt>CODE_COVERAGE</dt> <dd> <p>The report group contains code coverage reports.</p> </dd> <dt>TEST</dt> <dd> <p>The report group contains test reports.</p> </dd> </dl>
        exportConfig:
          allOf:
          - $ref: '#/components/schemas/ReportExportConfig'
          - description: 'Information about the destination where the raw data of this <code>ReportGroup</code> is exported. '
        created:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: 'The date and time this <code>ReportGroup</code> was created. '
        lastModified:
          allOf:
          - $ref: '#/components/schemas/Timestamp'
          - description: 'The date and time this <code>ReportGroup</code> was last modified. '
        tags:
          allOf:
          - $ref: '#/components/schemas/TagList'
          - description: <p>A list of tag key and value pairs associated with this report group. </p> <p>These tags are available for use by Amazon Web Services services that support CodeBuild report group tags.</p>
        status:
          allOf:
          - $ref: '#/components/schemas/ReportGroupStatusType'
          - description: <p>The status of the report group. This property is read-only.</p> <p>This can be one of the following values:</p> <dl> <dt>ACTIVE</dt> <dd> <p>The report group is active.</p> </dd> <dt>DELETING</dt> <dd> <p>The report group is in the process of being deleted.</p> </dd> </dl>
      description: 'A series of reports. Each report contains information about the results from running a series of test cases. You specify the test cases for a report group in the buildspec for a build project using one or more paths to the test case files. '
    ValueInput:
      type: string
      pattern: ^([\p{L}\p{Z}\p{N}_.:/=@+\-]*)$
      minLength: 0
      maxLength: 255
    InvalidInputException: {}
